name: Tests and coverage

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install coverage
        run: python -m pip install coverage
      - name: Run unit tests and enforce coverage
        run: |
          coverage run --branch --include='*/dehumidifier_plug/models.py,*/dehumidifier_plug/schedule.py' -m unittest discover -s tests -p 'test_*.py' -v
          coverage report -m --fail-under=95
      - name: Measure coordinator coverage
        run: |
          coverage run --branch --include='*/dehumidifier_plug/coordinator.py' -m unittest discover -s tests -p 'test_*.py' -v
          coverage report -m --fail-under=78
      - name: Compile integration
        run: python -m compileall -q custom_components/dehumidifier_plug tests
